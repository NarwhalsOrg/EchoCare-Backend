version: "3.9"

services:
  app:
    build: .
    container_name: diabetes-chatbot
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./app/ml/artifacts:/app/app/ml/artifacts
      - ./data:/app/data
    restart: always
    depends_on:
      - nginx
    networks:
      - webnet

  nginx:
    image: nginx:alpine
    container_name: nginx-diabetes-chatbot
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
