version: '3.8'

services:
  web:
    build: .
    container_name: fastapi_app
    restart: always
    volumes:
      - ./app:/app/app
      - ./app/static:/app/app/static
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - redis
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/app/static:ro
    depends_on:
      - web
    entrypoint: ["/bin/sh", "-c", "sleep 5 && nginx -g 'daemon off;'"]
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
